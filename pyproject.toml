[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ritesmith"
version = "0.1.0"
description = "AI-assisted capability and workflow generation control plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31",
    "alembic>=1.19",
    "python-ulid>=4.0",
    "python-dotenv>=1.2",
    "lupa>=2.8",
    "openai>=2.53",
    "httpx>=0.28",
    "mcp>=1.0,<2.0",  # v2.0 rewrote the low-level Server API used in ritesmith/api/mcp_handler.py and mcp-server/server.py — migration tracked separately, do not bump without updating that code
    "jsonschema>=4.26",
    "prometheus-client>=0.26",
    "slowapi>=0.1.10",
    # Tool providers
    "html2text>=2025.4",
    "duckdb>=1.5",
    "google-api-python-client>=2.198",
    "google-auth>=2.56",
    "google-auth-oauthlib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-httpx>=0.36",
    "pytest-cov>=7.1",
    "anyio>=4.14",
    "ruff>=0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["ritesmith"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["ritesmith/tests"]
markers = [
    "e2e: end-to-end tests that require a real OpenAI API key and live database",
]

[tool.ruff]
line-length = 100
target-version = "py312"
