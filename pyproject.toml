[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ritesmith"
version = "0.1.0"
description = "AI-assisted capability and workflow generation control plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-ulid>=3.0",
    "python-dotenv>=1.0",
    "lupa>=2.2",
    "openai>=1.55",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "prometheus-client>=0.20",
    "slowapi>=0.1.9",
    # Tool providers
    "html2text>=2024.2",
    "duckdb>=1.1",
    "google-api-python-client>=2.150",
    "google-auth>=2.36",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.33",
    "anyio>=4.6",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["ritesmith"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["ritesmith/tests"]
markers = [
    "e2e: end-to-end tests that require a real OpenAI API key and live database",
]

[tool.ruff]
line-length = 100
target-version = "py312"
