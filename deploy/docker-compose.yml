services:
  ritesmith-migrate:
    image: ritesmith:latest
    command: >
      sh -c "alembic upgrade head"
    env_file: .env
    networks:
      - deploy_default
    restart: "no"

  ritesmith:
    image: ritesmith:latest
    container_name: ritesmith
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      RITESMITH_LOOMHARBOR_URL: "http://loomharbor:8000"
      RITESMITH_WORKFLOW_DELEGATION_ENABLED: "true"
      RITESMITH_LUA_TIMEOUT_MS: "15000"
    volumes:
      - /home/thiago/reports:/reports
      - /home/thiago/findtag:/findtag:ro
    networks:
      - deploy_default
    depends_on:
      ritesmith-migrate:
        condition: service_completed_successfully

networks:
  deploy_default:
    external: true
